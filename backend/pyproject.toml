[project]
name = "ai-under-the-hood-backend"
version = "0.1.0"
description = "Backend for AI Under the Hood: health check and a streaming chat endpoint."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "openai>=3.52.0",
    "pydantic-settings>=2.16.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
